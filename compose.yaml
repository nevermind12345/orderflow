name: orderflow

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -C -b -l 5
          -Q "SELECT 1" > /dev/null
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  api:
    image: orderflow-api:dev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection:?Set the database connection string in .env}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      sql:
        condition: service_healthy
volumes:
  sql-data: